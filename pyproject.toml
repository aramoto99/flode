[build-system]
# PEP 639 (license expression) 完全対応のため >=71 を要求 (ADR-0013 §(1))
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflw"
version = "0.24.3"
description = "Block-diagram dynamic system simulator (Simulink-inspired)"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "aramoto99" }]
readme = "README.md"
dependencies = [
    # ADR-0035: Python 3.11+ で numpy 2.3+ の TypeVar default を活用、
    # bare ``np.ndarray`` を ``[type-arg]`` で弾けるようにする (= mypy --strict 完全復元)
    "numpy>=2.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/aramoto99/pyflw"
Issues = "https://github.com/aramoto99/pyflw/issues"

[project.scripts]
pyflw-server = "pyflw.server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.8",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "build>=1.2",
    # ADR-0035: Python 3.11+ で ``tomllib`` stdlib 利用、``tomli`` 条件付き dep 削除
    # ADR-0026: LinearSystem.to_control_ss() 用の python-control。dev には含めて
    # CI 上でも `to_control_ss` の実テスト (= test_linearize_to_control.py) が
    # importorskip しないよう default インストールする。
    "control>=0.10",
    # ADR-0037: linearize method='jax' / Simulator.compile() の CI 検証用に dev に
    # jax[cpu] を含める (= 本番依存ではないので [project] dependencies には入れない)。
    "jax[cpu]>=0.4,<0.5",
]
gui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    # ADR-0043: workspace 検索 (path fuzzy + content substring)、`.gitignore` 尊重
    "rapidfuzz>=3.6",
    "pathspec>=0.12",
]
# ADR-0026: 解析機能の opt-in extras。``LinearSystem.to_control_ss()`` 等で
# python-control に依存する。コア (`pyflw.linearize` など) は本 extras なしで動く。
control = [
    "control>=0.10",
]
# ADR-0037: jax-first Codegen + Autodiff (Phase 5b、v0.17.0)。``Simulator.compile()``
# / ``linearize(method="jax")`` 等で利用。CPU only、minor 互換は明示 pin。GPU は
# 別 extras ``pyflw[gpu]`` 経由 (ADR-0038 §論点 3 §(11))。
codegen = [
    "jax[cpu]>=0.4,<0.5",
]
# ADR-0038 (Phase 5 closure / v0.13.0): GPU バックエンド extras。NVIDIA CUDA 12 /
# Linux x86_64 wheel 限定 (jax の制約)、ROCm / Apple Silicon / TPU は Phase 6+。
# 実機ベンチマークは Phase 6+ ADR-0039 で整備、v1.0 では best-effort 扱い
# (SPEC §非機能要件「state size >= 10^5 で CPU 比 5x 以上を目標」と整合)。
gpu = [
    "jax[cuda12]>=0.4,<0.5",
]

[tool.setuptools.packages.find]
include = ["pyflw*"]
exclude = ["pyflw.web*"]

[tool.setuptools.package-data]
"pyflw.server" = ["static/**/*"]
# ADR-0029: 組み込み block library (std.flwlib.json) を wheel にバンドル
"pyflw.libraries" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (formatter handles)
    "B008",  # function call in default argument (numpy/dataclass パターン許容)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False in tests is fine

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# numpy/scipy は型 stub が部分的なので、strict のうち厳しすぎる項目を緩める
disallow_untyped_calls = false
disallow_subclassing_any = false
# ADR-0035: ``disallow_any_generics = true`` を復元 (= Phase 4 hotfix で false に
# していた借入金返済)。bare ``np.ndarray`` は全て ``npt.NDArray[Any]`` に置換済
# (Python 3.11+ + numpy 2.3+ なら不要だが、明示の方が型解析が安定する)。

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "control.*"]
ignore_missing_imports = true
