[build-system]
# PEP 639 (license expression) 完全対応のため >=71 を要求 (ADR-0013 §(1))
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflw"
version = "0.3.0"
description = "Block-diagram dynamic system simulator (Simulink-inspired)"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "aramoto99" }]
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/aramoto99/pyflw"
Issues = "https://github.com/aramoto99/pyflw/issues"

[project.scripts]
pyflw-server = "pyflw.server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.8",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "httpx>=0.27",
    "build>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]
gui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[tool.setuptools.packages.find]
include = ["pyflw*"]
exclude = ["pyflw.web*"]

[tool.setuptools.package-data]
"pyflw.server" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (formatter handles)
    "B008",  # function call in default argument (numpy/dataclass パターン許容)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False in tests is fine

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# numpy/scipy は型 stub が部分的なので、strict のうち厳しすぎる項目を緩める
disallow_untyped_calls = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
