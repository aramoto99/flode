name: PyPI Publish

# ADR-0032: TestPyPI → PyPI 2 段階 publish (= 安全弁)、Trusted Publishers (OIDC)。
# tag 形式は PEP 440 準拠 (= ``v0.13.0`` final / ``v0.13.0rc1`` pre-release)。
# pre-release tag は TestPyPI までで止まり、final tag のみ本 PyPI へ進む。

on:
  push:
    tags:
      - "v*"

# Trusted Publishers (OIDC) を使うため id-token: write が必須。
# secrets / API token は不使用 (= 漏洩リスクゼロ、ADR-0032 §1-A)。
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build wheel + sdist (PyPI 用)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: flode/web/frontend/package-lock.json

      - name: Build frontend
        working-directory: flode/web/frontend
        run: |
          npm ci
          npm run build

      - name: Stage frontend into flode/server/static
        run: |
          mkdir -p flode/server/static
          cp -r flode/web/frontend/dist/* flode/server/static/

      - name: Verify version sync (3 files)
        run: python tools/check_version_sync.py

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts (for downstream jobs)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  classify-tag:
    # PEP 440 で final / pre-release を判定 (ADR-0032 §4-A)。
    # pre-release は TestPyPI まで、final は本 PyPI まで進む。
    name: Classify tag (final vs pre-release)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      is_pre_release: ${{ steps.check.outputs.is_pre_release }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine if tag is pre-release
        id: check
        run: |
          python -m pip install --quiet packaging
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          IS_PRE=$(python -c "from packaging.version import Version; print('true' if Version('${VER}').is_prerelease else 'false')")
          echo "is_pre_release=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG} -> version ${VER}, is_prerelease=${IS_PRE}"

  publish-testpypi:
    # final / pre-release どちらでも常に TestPyPI へ publish (= ADR-0032 §2-A 安全弁)。
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, classify-tag]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flode
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (Trusted Publishers OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # skip-existing は TestPyPI 側のみ true (= 同 version 再 upload は no-op)。
          # 本 PyPI 側は false (= 厳格、ADR-0032 §8 yank only policy)。
          skip-existing: true

  publish-pypi:
    # final tag のみ本 PyPI に publish (= ADR-0032 §4-A)。
    # pre-release (rc / a / b / dev) は TestPyPI 検証で停止。
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-testpypi, classify-tag]
    if: needs.classify-tag.outputs.is_pre_release == 'false'
    environment:
      name: pypi
      url: https://pypi.org/p/flode
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishers OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 同 version 再 upload は明示的にエラーにする (= 事故検出を上げる)。
          skip-existing: false
