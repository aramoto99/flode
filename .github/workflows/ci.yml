name: CI

on:
  push:
    branches: [main]
    # Python パッケージとドキュメント関連変更のみで CI を起動する。
    # frontend 専用変更 (`pyflw/web/frontend/**`) は ci-frontend.yml に分離している。
    # negative pattern (!) は GitHub Actions の minimatch で評価順序依存があるため、
    # サブパッケージを個別に列挙する方が確実 (frontend 以外を全て include)。
    paths:
      - "pyflw/__init__.py"
      - "pyflw/exceptions.py"
      - "pyflw/blocks/**"
      - "pyflw/core/**"
      - "pyflw/server/**"
      - "pyflw/subsystems/**"
      - "pyflw/web/__init__.py"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyflw/__init__.py"
      - "pyflw/exceptions.py"
      - "pyflw/blocks/**"
      - "pyflw/core/**"
      - "pyflw/server/**"
      - "pyflw/subsystems/**"
      - "pyflw/web/__init__.py"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-type:
    name: Lint & Type (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check pyflw tests examples

      - name: Ruff (format check)
        run: ruff format --check pyflw tests examples

      - name: Mypy (--strict on package)
        run: mypy pyflw

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -ra

  docs:
    name: Docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Sphinx build (warnings as errors)
        run: sphinx-build -W -b html docs docs/_build
