name: CI (Frontend)

on:
  push:
    branches: [main]
    # Frontend (Vite + React + Vitest) 専用ワークフロー。
    # Python 側 (ci.yml) と paths filter を分離することで、Python のみ変更時の
    # npm install/build 時間 (~2-3 分) を節約する。
    # `pyproject.toml` は frontend から独立しているため意図的に除外
    # (frontend は package.json/package-lock.json 管理)。frontend が
    # pyproject.toml に依存するようになった場合はここに追加する。
    paths:
      - "pyflw/web/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "pyflw/web/frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyflw/web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pyflw/web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
