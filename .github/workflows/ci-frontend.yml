name: CI (Frontend)

on:
  push:
    branches: [main]
    # Frontend (Vite + React + Vitest) 専用ワークフロー。
    # Python 側 (ci.yml) と paths filter を分離することで、Python のみ変更時の
    # npm install/build 時間 (~2-3 分) を節約する。
    # `pyproject.toml` は frontend から独立しているため意図的に除外
    # (frontend は package.json/package-lock.json 管理)。frontend が
    # pyproject.toml に依存するようになった場合はここに追加する。
    paths:
      - "flode/web/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "flode/web/frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flode/web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: flode/web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright + FastAPI backend)
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flode/web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: flode/web/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install flode (FastAPI server is a core dependency since v0.44.0)
        # E2E では `python -m flode.server.cli` でバックエンドを起動するため
        # repo root から editable install。playwright.config.ts の
        # `cwd: "../../.."` で対応する。
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('flode/web/frontend/package-lock.json') }}

      - name: Install Playwright browsers (and OS deps)
        # `--with-deps chromium` は冪等。キャッシュヒット時はバイナリ展開だけスキップ
        # され、不足分があれば再インストールされる。OS deps (apt) は毎回インストール。
        # キャッシュ破損時にバイナリ不在で気付かず ``ブラウザ起動失敗`` になるのを
        # 防ぐため、独立 step ではなく統合実行 (code-reviewer MUST 修正)。
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: flode/web/frontend/playwright-report/
          retention-days: 7
